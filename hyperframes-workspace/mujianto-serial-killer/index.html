<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>SERIAL KILLER NGANJUK - True Crime Explainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #0D1117;
      overflow: hidden;
    }
    .shot-layer {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .shot-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    /* Subtle Atmospheric Vignette */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(10, 13, 18, 0) 50%, rgba(10, 13, 18, 0.65) 100%);
      pointer-events: none;
      z-index: 20;
    }
    /* Noir Forensic Glitch Overlay */
    #forensic-glitch {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 2px, transparent 2px, transparent 4px);
      filter: drop-shadow(-6px 0 #8B2635) drop-shadow(6px 0 #C59B27);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="main">
    <!-- Shot 00: Mandatory Cover Hook (0.0s - 1.5s) -->
    <div id="shot-00" class="shot-layer" style="opacity: 1;">
      <img src="assets/cover-shot-00.jpg" alt="Cover Hook" class="shot-img" />
    </div>

    <!-- Shots 01 to 14 -->
    <div id="shot-01" class="shot-layer" style="opacity: 0;"><img src="assets/shot-01.jpg" alt="Shot 1" class="shot-img" /></div>
    <div id="shot-02" class="shot-layer" style="opacity: 0;"><img src="assets/shot-02.jpg" alt="Shot 2" class="shot-img" /></div>
    <div id="shot-03" class="shot-layer" style="opacity: 0;"><img src="assets/shot-03.jpg" alt="Shot 3" class="shot-img" /></div>
    <div id="shot-04" class="shot-layer" style="opacity: 0;"><img src="assets/shot-04.jpg" alt="Shot 4" class="shot-img" /></div>
    <div id="shot-05" class="shot-layer" style="opacity: 0;"><img src="assets/shot-05.jpg" alt="Shot 5" class="shot-img" /></div>
    <div id="shot-06" class="shot-layer" style="opacity: 0;"><img src="assets/shot-06.jpg" alt="Shot 6" class="shot-img" /></div>
    <div id="shot-07" class="shot-layer" style="opacity: 0;"><img src="assets/shot-07.jpg" alt="Shot 7" class="shot-img" /></div>
    <div id="shot-08" class="shot-layer" style="opacity: 0;"><img src="assets/shot-08.jpg" alt="Shot 8" class="shot-img" /></div>
    <div id="shot-09" class="shot-layer" style="opacity: 0;"><img src="assets/shot-09.jpg" alt="Shot 9" class="shot-img" /></div>
    <div id="shot-10" class="shot-layer" style="opacity: 0;"><img src="assets/shot-10.jpg" alt="Shot 10" class="shot-img" /></div>
    <div id="shot-11" class="shot-layer" style="opacity: 0;"><img src="assets/shot-11.jpg" alt="Shot 11" class="shot-img" /></div>
    <div id="shot-12" class="shot-layer" style="opacity: 0;"><img src="assets/shot-12.jpg" alt="Shot 12" class="shot-img" /></div>
    <div id="shot-13" class="shot-layer" style="opacity: 0;"><img src="assets/shot-13.jpg" alt="Shot 13" class="shot-img" /></div>
    <div id="shot-14" class="shot-layer" style="opacity: 0;"><img src="assets/shot-14.jpg" alt="Shot 14" class="shot-img" /></div>

    <div class="vignette-overlay"></div>
    <div id="forensic-glitch"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = { main: tl };

    // Glitch trigger helper
    function triggerNoirGlitch(time) {
      tl.to("#forensic-glitch", {
        opacity: 0.85,
        duration: 0.06,
        ease: "power1.inOut",
        onStart: () => gsap.set("#stage", { filter: "invert(0.12) contrast(1.4)" }),
      }, time)
      .to("#forensic-glitch", {
        opacity: 0,
        duration: 0.12,
        ease: "power2.out",
        onComplete: () => gsap.set("#stage", { filter: "none" }),
      }, time + 0.06);
    }

    // Shot 00: Cover Hook (0.0s - 1.50s)
    tl.to("#shot-00 .shot-img", { scale: 1.05, duration: 1.50, ease: "none" }, 0);

    // Transition Times
    const transitionTimes = [1.5, 7.38, 13.26, 19.14, 25.02, 30.9, 36.78, 42.66, 48.54, 54.42, 60.3, 66.18, 72.06, 77.94];
    transitionTimes.forEach(t => triggerNoirGlitch(t));

    // Cut from Hook to Shot 01 at 1.50s
    tl.set("#shot-00", { autoAlpha: 0 }, 1.50);
    tl.set("#shot-01", { autoAlpha: 1 }, 1.50);

    // Shot Configurations
    const shots = [
      { id: "#shot-01", start: 1.50, end: 7.38, dur: 5.88, motion: 0 },
      { id: "#shot-02", start: 7.38, end: 13.26, dur: 5.88, motion: 1 },
      { id: "#shot-03", start: 13.26, end: 19.14, dur: 5.88, motion: 2 },
      { id: "#shot-04", start: 19.14, end: 25.02, dur: 5.88, motion: 0 },
      { id: "#shot-05", start: 25.02, end: 30.90, dur: 5.88, motion: 1 },
      { id: "#shot-06", start: 30.90, end: 36.78, dur: 5.88, motion: 2 },
      { id: "#shot-07", start: 36.78, end: 42.66, dur: 5.88, motion: 0 },
      { id: "#shot-08", start: 42.66, end: 48.54, dur: 5.88, motion: 1 },
      { id: "#shot-09", start: 48.54, end: 54.42, dur: 5.88, motion: 2 },
      { id: "#shot-10", start: 54.42, end: 60.30, dur: 5.88, motion: 0 },
      { id: "#shot-11", start: 60.30, end: 66.18, dur: 5.88, motion: 1 },
      { id: "#shot-12", start: 66.18, end: 72.06, dur: 5.88, motion: 2 },
      { id: "#shot-13", start: 72.06, end: 77.94, dur: 5.88, motion: 0 },
      { id: "#shot-14", start: 77.94, end: 83.85, dur: 5.91, motion: 1 }
    ];

    shots.forEach((s, idx) => {
      const next = idx < shots.length - 1 ? shots[idx + 1].id : null;
      if (s.motion === 0) {
        tl.fromTo(s.id + " .shot-img", { scale: 1.0 }, { scale: 1.08, duration: s.dur, ease: "none" }, s.start);
      } else if (s.motion === 1) {
        tl.fromTo(s.id + " .shot-img", { scale: 1.06, yPercent: 2 }, { scale: 1.0, yPercent: -2, duration: s.dur, ease: "none" }, s.start);
      } else {
        tl.fromTo(s.id + " .shot-img", { scale: 1.04, xPercent: -2 }, { scale: 1.08, xPercent: 1.5, duration: s.dur, ease: "none" }, s.start);
      }

      if (next) {
        tl.set(s.id, { autoAlpha: 0 }, s.end);
        tl.set(next, { autoAlpha: 1 }, s.end);
      }
    });
  </script>
</body>
</html>
